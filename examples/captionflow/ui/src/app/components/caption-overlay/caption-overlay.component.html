@if (text()) {
  <div [class]="layerClasses()">
    <span
      [class]="bandClasses()"
      [style.--caption-font-size]="variables().fontSize"
      [style.--caption-font-weight]="variables().fontWeight"
      [style.--caption-line-height]="variables().lineHeight"
      [style.--caption-letter-spacing]="variables().letterSpacing"
      [style.--caption-padding-x]="variables().paddingHorizontal"
      [style.--caption-padding-y]="variables().paddingVertical"
      [style.--caption-radius]="variables().radius"
      [style.--caption-text-color]="variables().textColor"
      [style.--caption-box-color]="variables().boxColor"
      [style.--caption-box-opacity]="variables().boxOpacity"
      [title]="text()"
      ><span class="caption-text">{{ text() }}</span></span
    >
  </div>
}
