<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CaptionFlow</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <h1>CaptionFlow</h1>
    </header>
    <main class="page">
      <div class="watch-layout" id="watch-layout">
      <section class="player-card" aria-label="Video player">
        <div class="video-shell no-video controls-visible" id="video-shell">
          <video id="video" playsinline preload="metadata" tabindex="0" aria-label="Video with captions"></video>
          <div class="empty-state" id="empty-state">
            <p class="empty-title">No video yet</p>
            <p class="empty-text">Upload a video from your device, or paste a link to one.</p>
            <label class="btn btn-primary" for="video-file">Upload video</label>
            <input id="video-file" type="file" accept="video/mp4,video/webm,video/ogg,video/quicktime" hidden />
            <form class="link-form" id="link-form">
              <label for="video-link">Or paste a video link</label>
              <div class="link-row">
                <input id="video-link" type="url" inputmode="url" placeholder="https://example.com/video.mp4" autocomplete="off" />
                <button id="load-link" class="btn" type="submit">Load link</button>
              </div>
            </form>
          </div>
          <div class="progress-overlay" id="progress-overlay" hidden>
            <div class="spinner" aria-hidden="true"></div>
            <p class="progress-title" id="progress-title" aria-live="polite"></p>
            <p class="progress-detail" id="progress-detail"></p>
          </div>
          <div class="caption-wrap contrast-normal" id="caption-wrap">
            <div id="caption" aria-live="off"></div>
          </div>
          <div id="caption-settings-root" class="caption-settings-root" hidden></div>
                <div id="pace-menu" class="pace-menu" role="group" aria-label="Reading pace" hidden>
                  <fieldset class="speed-presets">
                    <legend>Speed</legend>
                    <label><input type="radio" name="speed" value="0.25" /> 0.25×</label>
                    <label><input type="radio" name="speed" value="0.5" /> 0.5×</label>
                    <label><input type="radio" name="speed" value="0.75" /> 0.75×</label>
                    <label><input type="radio" name="speed" value="0.9" /> 0.9×</label>
                    <label><input type="radio" name="speed" value="1" checked /> Normal</label>
                    <label><input type="radio" name="speed" value="1.25" /> 1.25×</label>
                    <label><input type="radio" name="speed" value="1.5" /> 1.5×</label>
                    <label><input type="radio" name="speed" value="1.75" /> 1.75×</label>
                    <label><input type="radio" name="speed" value="2" /> 2×</label>
                  </fieldset>
                  <div class="speed-custom">
                    <label for="speed-slider">Custom speed</label>
                    <output id="speed-value" for="speed-slider">1×</output>
                    <button id="speed-down" class="speed-step" type="button" aria-label="Slower" title="Slower (Shift + &lt;)">−</button>
                    <input id="speed-slider" type="range" min="0.25" max="2" step="0.05" value="1" aria-valuetext="Normal speed" />
                    <button id="speed-up" class="speed-step" type="button" aria-label="Faster" title="Faster (Shift + &gt;)">+</button>
                  </div>
                  <label class="pause-toggle"><input type="checkbox" id="pause-each-caption" /> Pause at each caption</label>
                </div>
                <div class="player-bar" id="player-bar" role="group" aria-label="Video controls">
                  <p id="player-hint" class="player-hint" hidden>
                    Paused so you can read. Press Play or Next.
                  </p>
                  <input id="seek" class="bar-seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek" aria-valuetext="0:00 of 0:00" title="Seek (Left and Right arrows: 5 seconds)" />
                  <div class="bar-buttons">
                    <div class="bar-group bar-left">
                      <button id="change-video" class="bar-btn" type="button" aria-label="Change video" title="Change video">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 20h14v-2H5v2zM12 3l-5 5h3v6h4V8h3z"/></svg>
                      </button>
                      <button id="play" class="bar-btn" type="button" data-state="paused" aria-label="Play" title="Play (Space or K)">
                        <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg><svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
                      </button>
                      <button id="replay" class="bar-btn bar-btn-essential" type="button" aria-label="Replay this caption" title="Replay this caption (R)">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg><span class="bar-text">Replay this caption</span>
                      </button>
                      <button id="next" class="bar-btn bar-btn-essential" type="button" aria-label="Next caption" title="Next caption (N)">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l8.5 6L6 18zM16 6h2v12h-2z"/></svg><span class="bar-text">Next caption</span>
                      </button>
                      <span id="time" class="bar-time">0:00 / 0:00</span>
                    </div>
                    <div class="bar-group bar-right">
                      <button id="transcript-toggle" class="bar-btn" type="button" aria-pressed="true" aria-controls="transcript-panel" aria-label="Transcript" title="Hide transcript">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h2v2H3zm4 0h14v2H7zM3 11h2v2H3zm4 0h14v2H7zM3 17h2v2H3zm4 0h14v2H7z"/></svg>
                      </button>
                      <button id="pace-button" class="bar-btn" type="button" aria-expanded="false" aria-controls="pace-menu" aria-label="Reading pace: normal speed" title="Reading pace (Shift + &lt; or &gt; to change speed)">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4a9 9 0 0 0-7.4 14.1l1.6-1.2A7 7 0 1 1 19 13a7 7 0 0 1-1.2 3.9l1.6 1.2A9 9 0 0 0 12 4zm4.6 4.2-5.7 4.3a1.6 1.6 0 1 0 2.3 2.2z"/></svg><span class="bar-text" id="pace-text">Pace: Normal</span>
                      </button>
                      <button id="cc" class="bar-btn" type="button" aria-expanded="false" aria-controls="caption-settings-root" aria-label="CC: caption settings" title="Caption settings (C)">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2" y="5" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 10.2a2.5 2.5 0 1 0 0 3.6M17.5 10.2a2.5 2.5 0 1 0 0 3.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                      </button>
                      <button id="mute" class="bar-btn" type="button" data-state="unmuted" aria-label="Mute" title="Mute (M)">
                        <svg class="icon icon-unmuted" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="icon icon-muted" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="m16 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                      </button>
                      <button id="fullscreen" class="bar-btn" type="button" data-state="off" aria-label="Full screen" title="Full screen (F)">
                        <svg class="icon icon-fs-enter" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 0h2v5h-5v-2h3z"/></svg><svg class="icon icon-fs-exit" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4v5H4V7h3V4zm6 0h2v3h3v2h-5zM4 15h5v5H7v-3H4zm11 0h5v2h-3v3h-2z"/></svg>
                      </button>
                    </div>
                  </div>
                </div>
        </div>
        <p id="message" class="message" role="status" aria-live="polite">Upload a video, or paste a link to one.</p>
      </section>
                <section class="transcript-panel" id="transcript-panel" aria-labelledby="transcript-title">
                  <div class="transcript-header">
                    <h3 id="transcript-title">Transcript</h3>
                    <div class="transcript-options-wrap">
                      <button id="transcript-options-button" class="icon-btn" type="button" aria-expanded="false" aria-controls="transcript-options" aria-label="Transcript options" title="Transcript options">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
                      </button>
                      <div id="transcript-options" class="transcript-options" role="group" aria-label="Transcript options" hidden>
                        <label
                          ><input type="checkbox" id="follow" checked /> Follow playback</label
                        >
                        <label
                          ><input type="checkbox" id="show-times" checked /> Show times</label
                        >
                        <label class="option-select"
                          >Text size
                          <select id="transcript-size">
                            <option value="normal">Normal</option>
                            <option value="large">Large</option>
                            <option value="xlarge">Extra large</option>
                          </select></label
                        >
                        <button id="download-transcript" type="button" disabled>
                          Save transcript (.txt)
                        </button>
                      </div>
                    </div>
                  </div>
                  <div class="transcript-search" role="search">
                    <label for="transcript-search" class="visually-hidden"
                      >Search this transcript</label
                    >
                    <div class="search-row">
                      <input
                        id="transcript-search"
                        type="search"
                        autocomplete="off"
                        placeholder="Search transcript"
                      />
                      <button id="search-prev" class="icon-btn" type="button" aria-label="Previous match" title="Previous match" disabled>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7.4 15.4 4.6-4.6 4.6 4.6L18 14l-6-6-6 6z"/></svg>
                      </button>
                      <button id="search-next" class="icon-btn" type="button" aria-label="Next match" title="Next match" disabled>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
                      </button>
                    </div>
                    <p id="search-status" class="small search-status" role="status" aria-live="polite"></p>
                  </div>
                  <div class="language-row">
                    <label for="target-language">Caption language</label>
                    <select id="target-language" aria-describedby="translation-status">
                      <option value="">Original spoken language</option>
                      <option value="en">English</option>
                      <option value="sw">Kiswahili</option>
                    </select>
                    <p id="translation-status" class="small" role="status" aria-live="polite"></p>
                  </div>
                  <ol id="transcript" class="transcript"></ol>
                </section>
      </div>
    </main>
  </body>
</html>
